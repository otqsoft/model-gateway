# Dify 插件 Manifest（新版）：须为 type: plugin，并与 main.py / pyproject.toml 配套。
# 旧版 type: model 单文件 manifest 在新版 Dify 中会导致安装/解析失败（PluginDecodeResponse 等）。
version: 1.0.0
type: plugin
author: otqsoft
name: model_gateway
created_at: "2026-05-08T00:00:00Z"
description:
  en_US: use models exposed by model-gateway (OpenAI-compatible API).
  zh_Hans: 通过 model-gateway 提供的 OpenAI 兼容接口使用已配置的模型。
label:
  en_US: Model Gateway
  zh_Hans: 模型网关
# 与官方模型插件一致：图标放在 _assets/，此处只写文件名（daemon 会从 _assets 解析）
icon: icon_s_en.svg
plugins:
  models:
    - provider/model_gateway.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
      moderation: false
      rerank: false
      speech2text: false
      text_embedding: false
      tts: false
