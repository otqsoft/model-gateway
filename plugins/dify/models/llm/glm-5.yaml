model: glm-5
label:
  en_US: GLM-5
  zh_Hans: GLM-5
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
  - name: top_p
    use_template: top_p
  - name: thinking_mode
    type: boolean
    default: false
    label:
      en_US: Thinking Mode
      zh_Hans: 思考模式
    help:
      en_US: Enable reasoning/thinking mode for the model
      zh_Hans: 启用模型的思考/推理模式
